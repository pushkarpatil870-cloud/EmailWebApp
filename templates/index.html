<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender App</title>
    <!-- Bootstrap 5 CSS for styling and responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Our Custom CSS -->
    <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg">
                <!-- Header with Title and Dark Mode Toggle -->
                <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
                    <h4 class="mb-0"><i class="fas fa-paper-plane me-2"></i>Email Sender App</h4>
                    <button class="btn btn-sm btn-outline-light" id="themeToggle">
                        <i class="fas fa-moon"></i> Dark Mode
                    </button>
                </div>
                
                <div class="card-body p-4">
                    <!-- Flash Messages for Success/Errors -->
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <!-- Form with multipart/form-data for handling file uploads -->
                    <form action="/" method="POST" enctype="multipart/form-data" id="emailForm">
                        
                        <!-- Sender Details -->
                        <div class="mb-3">
                            <label for="sender_email" class="form-label fw-bold">Sender Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                <input type="email" class="form-control" id="sender_email" name="sender_email" required placeholder="your.email@gmail.com">
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="password" class="form-label fw-bold">App Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required placeholder="16-character App Password">
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="form-text text-muted small">Requires a 16-digit App Password if you use 2-Step Verification.</div>
                        </div>

                        <!-- Receiver Details -->
                        <div class="mb-3">
                            <label for="receiver_email" class="form-label fw-bold">Receiver Email</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-paper-plane"></i></span>
                                <input type="email" class="form-control" id="receiver_email" name="receiver_email" required placeholder="recipient@example.com">
                            </div>
                        </div>

                        <!-- Email Content -->
                        <div class="mb-3">
                            <label for="subject" class="form-label fw-bold">Subject</label>
                            <input type="text" class="form-control" id="subject" name="subject" placeholder="What is this about?">
                        </div>
                        
                        <div class="mb-3">
                            <label for="message" class="form-label fw-bold">Message</label>
                            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Write your email content here..."></textarea>
                        </div>
                        
                        <!-- File Upload -->
                        <div class="mb-4">
                            <label for="attachments" class="form-label fw-bold">Attachments <span class="text-muted fw-normal">(Optional, Multiple allowed)</span></label>
                            <input class="form-control" type="file" id="attachments" name="attachments" multiple>
                        </div>
                        
                        <!-- Submit Button -->
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg" id="sendBtn">
                                <span class="btn-text">Send Email</span>
                                <span class="spinner-border spinner-border-sm d-none ms-2" role="status" aria-hidden="true" id="loadingSpinner"></span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
            
            <div class="text-center mt-3 text-muted small">
                Securely powered by Python & Flask.
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS Scripts -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
