{% extends "base.html" %}
{% block auth_content %}
<div class="card-premium p-5 shadow" style="width: 420px; border-radius: 12px;">
    <div class="text-center mb-4">
        <h2 class="fw-bold"><i class="fas fa-envelope-open-text text-primary me-2"></i>MailFlow</h2>
        <p class="text-muted small">Professional Mail Delivery Service</p>
    </div>
    
    <h5 class="text-center mb-4 fw-semibold">Sign In</h5>
    
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-4">
            <label class="form-label form-label-custom">Username</label>
            <input type="text" class="form-control form-control-custom" name="username" required placeholder="Enter username">
        </div>
        <div class="mb-4">
            <label class="form-label form-label-custom">Password</label>
            <div class="input-group">
                <input type="password" class="form-control form-control-custom border-end-0" id="loginPassword" name="password" required placeholder="Enter password">
                <button class="btn btn-outline-custom border-start-0 toggle-password-btn" type="button" data-target="loginPassword">
                    <i class="fas fa-eye text-muted"></i>
                </button>
            </div>
        </div>
        <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-semibold">Login</button>
    </form>
    
    <div class="mt-4 text-center">
        <small class="text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary text-decoration-none fw-semibold">Register here</a></small>
    </div>
</div>
{% endblock %}
