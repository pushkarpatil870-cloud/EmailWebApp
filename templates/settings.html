{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <!-- SMTP Gateway Configuration Card -->
        <div class="card-premium p-4 shadow-sm mb-4">
            <h4 class="mb-4 fw-bold"><i class="fas fa-server text-primary me-2"></i>SMTP Gateway Credentials</h4>
            
            <form method="POST" action="{{ url_for('routes.settings') }}">
                <div class="mb-4">
                    <label class="form-label form-label-custom">Email Gateway Address</label>
                    <input type="email" class="form-control form-control-custom" name="email_address" value="{{ setting.email_address or '' }}" required placeholder="your.email@gmail.com">
                </div>
                
                <div class="mb-4">
                    <label class="form-label form-label-custom">SMTP Gateway Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-custom border-end-0" id="app_password" name="app_password" value="{{ setting.app_password or '' }}" required placeholder="Enter SMTP/App password">
                        <button class="btn btn-outline-custom border-start-0 toggle-password-btn" type="button" data-target="app_password">
                            <i class="fas fa-eye text-muted"></i>
                        </button>
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-8 mb-3 mb-md-0">
                        <label class="form-label form-label-custom">SMTP Server Address</label>
                        <input type="text" class="form-control form-control-custom" name="smtp_server" value="{{ setting.smtp_server }}" required placeholder="smtp.gmail.com">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label form-label-custom">SMTP Server Port</label>
                        <input type="number" class="form-control form-control-custom" name="smtp_port" value="{{ setting.smtp_port }}" required placeholder="465">
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom px-5">Save Configuration</button>
            </form>
        </div>

        <!-- Change Account Password Card -->
        <div class="card-premium p-4 shadow-sm">
            <h4 class="mb-4 fw-bold"><i class="fas fa-key text-primary me-2"></i>Change Account Password</h4>
            
            <form method="POST" action="{{ url_for('auth.change_password') }}">
                <div class="mb-4">
                    <label class="form-label form-label-custom">Current Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control form-control-custom border-end-0" id="current_password" name="current_password" required placeholder="Enter current password">
                        <button class="btn btn-outline-custom border-start-0 toggle-password-btn" type="button" data-target="current_password">
                            <i class="fas fa-eye text-muted"></i>
                        </button>
                    </div>
                </div>
                
                <div class="row mb-4">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label class="form-label form-label-custom">New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-custom border-end-0" id="new_password" name="new_password" required placeholder="At least 6 characters">
                            <button class="btn btn-outline-custom border-start-0 toggle-password-btn" type="button" data-target="new_password">
                                <i class="fas fa-eye text-muted"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label form-label-custom">Confirm New Password</label>
                        <div class="input-group">
                            <input type="password" class="form-control form-control-custom border-end-0" id="confirm_password" name="confirm_password" required placeholder="Repeat new password">
                            <button class="btn btn-outline-custom border-start-0 toggle-password-btn" type="button" data-target="confirm_password">
                                <i class="fas fa-eye text-muted"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary-custom px-5">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
